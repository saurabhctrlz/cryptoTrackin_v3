<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A fan page dedicated to Kyle Crane, the legendary hero of Harran from Dying Light.">
    <title>Kyle Crane | The Hero of Harran</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">
            <img src="https://i.pinimg.com/1200x/30/3c/bc/303cbc78b2a3f81e33ac4f00e810224f.jpg" alt="Dying Light Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#soundboard">Soundboard</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-bg">
            <img src="https://i.pinimg.com/1200x/ef/c0/74/efc0743bc7aa791f00d028f6ef27eec2.jpg"
                alt="Kyle Crane overlooking Harran">
            <div class="overlay"></div>
        </div>
        <div class="hero-content">
            <h1>KYLE CRANE</h1>
            <p class="subtitle">The Hero of Harran</p>
            <a href="#gallery" class="btn">Explore the Legend</a>
        </div>
    </section>

    <!-- Gallery Section -->
    <section id="gallery" class="gallery-section">
        <div class="container">
            <h2>memes</h2>
            <div class="gallery-grid">
                <!-- Images -->
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/736x/63/67/6f/63676f5782021aa16fc052c64023e1bd.jpg"
                        alt="Kyle Crane Artwork">
                </div>
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/736x/40/02/d8/4002d891d1c8d08278c05b5a79f0c7fc.jpg"
                        alt="Kyle Crane Portrait">
                </div>
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/736x/63/5e/c2/635ec2e0f626fa107fb81ae812b7e361.jpg"
                        alt="Kyle Crane Action">
                </div>
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/control1/1200x/10/6b/9d/106b9da8ac76fb75322b5f085a35ae2d.jpg"
                        alt="Kyle Crane Combat">
                </div>
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/736x/a0/8e/94/a08e949d09ef0b21df163383cf733ee5.jpg"
                        alt="Kyle Crane Masked">
                </div>
                <div class="gallery-item-wrapper">
                    <img class="gallery-item"
                        src="https://i.pinimg.com/1200x/98/c5/7d/98c57d0c68c023e151802c4b1e44ea4d.jpg"
                        alt="Kyle Crane Parkour">
                </div>

                <!-- GIFs -->
                <div class="gallery-item-wrapper gif-wrapper">
                    <img class="gallery-item gif"
                        src="https://media1.tenor.com/m/-rfD4MkyM2QAAAAd/kyle-crane-dying-light.gif"
                        alt="Crane Action GIF">
                </div>
                <div class="gallery-item-wrapper gif-wrapper">
                    <img class="gallery-item gif"
                        src="https://media1.tenor.com/m/sGJatBs2ehkAAAAd/beasting-it-dying-light-the-beast.gif"
                        alt="The Beast GIF">
                </div>
                <div class="gallery-item-wrapper gif-wrapper">
                    <img class="gallery-item gif"
                        src="https://media1.tenor.com/m/wGDI3KVLbN0AAAAd/kyle-crane-dying-light.gif"
                        alt="Crane Looking GIF">
                </div>
                <div class="gallery-item-wrapper gif-wrapper">
                    <img class="gallery-item gif"
                        src="https://media1.tenor.com/m/dOpY0xCFij4AAAAd/mrbeast-dyinglight.gif"
                        alt="Crane MRBEAST Meme GIF">
                </div>
            </div>
        </div>
    </section>

    <!-- Unleash Section -->
    <section id="unleash" class="unleash-section">
        <div class="container" style="text-align: center;">
            <button id="unleashBtn" class="btn unleash-btn">UNLEASH THE BEAST</button>
            <audio id="beastAudio" src="https://us-tuna-sounds-files.voicemod.net/461c6406-a049-4088-9e55-4bba5ab50b80-1759814312635.mp3" preload="auto"></audio>
        </div>
    </section>

    <!-- Soundboard Section -->
    <section id="soundboard" class="soundboard-section">
        <div class="container">
            <h2>Soundboard</h2>
            <div class="soundboard-grid">
                <iframe src="https://www.voicy.network/embed/g_x3mOhw5kq-zdxnd9wmXQ" width="100%" height="150"
                    frameborder="0" scrolling="no"></iframe>
                <iframe src="https://www.voicy.network/embed/5nNnXFX1LkmRVxueKp-uig" width="100%" height="150"
                    frameborder="0" scrolling="no"></iframe>
                <iframe src="https://www.voicy.network/embed/4CCK5guSxkirkRRVmw-ulA" width="100%" height="150"
                    frameborder="0" scrolling="no"></iframe>
                <iframe src="https://www.voicy.network/embed/RrmAfd2gJk6dipXnXHerbQ" width="100%" height="150"
                    frameborder="0" scrolling="no"></iframe>
                <iframe src="https://www.voicy.network/embed/blpIdUYKk0WVw3e2uonknQ" width="100%" height="150"
                    frameborder="0" scrolling="no"></iframe>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>GOOD NIGHT, GOOD LUCK.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
